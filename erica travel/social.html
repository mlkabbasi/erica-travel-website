<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media</title>
    
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #eef5f4;
        color: #1f2937;
        line-height: 1.7;
    }
    header {
        background: #2f6f73;
        color: white;
        padding: 28px 16px;
        text-align: center;
    }
    nav {
        background: #244c50;
        text-align: center;
        padding: 12px;
    }
    nav a {
        color: white;
        text-decoration: none;
        margin: 0 10px;
        display: inline-block;
        padding: 6px 8px;
    }
    nav a:hover { text-decoration: underline; }
    main {
        max-width: 1000px;
        margin: 24px auto;
        padding: 0 16px;
    }
    .card {
        background: white;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .hero {
        width: 100%;
        max-height: 420px;
        object-fit: cover;
        border-radius: 10px;
        margin-top: 14px;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
    }
    .grid img {
        width: 100%;
        height: 190px;
        object-fit: cover;
        border-radius: 8px;
    }
    form input, form textarea, form select {
        width: 100%;
        padding: 10px;
        margin: 6px 0 14px;
        border: 1px solid #bbb;
        border-radius: 6px;
    }
    button {
        background: #2f6f73;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
    }
    footer {
        background: #244c50;
        color: white;
        text-align: center;
        padding: 16px;
        margin-top: 30px;
    }
    @media (max-width: 600px) {
        nav a { display: block; margin: 5px 0; }
        header h1 { font-size: 28px; }
    }
</style>

</head>

</nav>

<section class="card">
    <h2>Follow Erica</h2>
    <p>You can follow Erica on social media to see travel updates, photos, and new destinations.</p>
    <ul>
        <li>Instagram</li>
        <li>Facebook</li>
        <li>YouTube</li>
        <li>X</li>
        <li>Pinterest</li>
    </ul>
</section>
